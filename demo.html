<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>奈美德醫療器材｜網站設計初稿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:#f5f3ee; --card:#fbfaf7; --ink:#15222b; --sub:#56636c; --line:#d6d2c8;
    --teal:#0b5d5a; --teal-deep:#083f3d; --signal:#b9412b;
    --serif:"Noto Serif TC","Hiragino Mincho ProN","Yu Mincho",serif;
    --sans:"Noto Sans TC","Hiragino Sans","Yu Gothic","Microsoft JhengHei",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.9 var(--sans); -webkit-font-smoothing:antialiased; }
  a { color:inherit; }
  :focus-visible { outline:2px solid var(--signal); outline-offset:3px; }
  .wrap { max-width:1120px; margin:0 auto; padding:0 28px; }
  .mono { font-family:var(--mono); font-size:12.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--sub); }

  /* 初稿標示 */
  .draft { background:var(--ink); color:#e9e6de; font-size:13px; line-height:1.6; }
  .draft .wrap { display:flex; gap:16px; justify-content:space-between; align-items:center; padding-top:8px; padding-bottom:8px; }
  .draft b { color:#fff; font-weight:500; margin-right:.6em; }
  .draft a { white-space:nowrap; text-underline-offset:3px; }

  /* 頁首 */
  .top { position:sticky; top:0; z-index:20; background:rgba(245,243,238,.94); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); }
  .top .wrap { display:flex; align-items:center; gap:28px; min-height:68px; }
  .brand { display:flex; align-items:center; gap:12px; text-decoration:none; margin-right:auto; }
  .brand svg { width:30px; height:30px; flex:none; }
  .brand span { font-family:var(--serif); font-weight:700; font-size:19px; letter-spacing:.08em; white-space:nowrap; }
  nav { display:flex; gap:26px; }
  nav a { text-decoration:none; font-size:15px; padding:6px 0; border-bottom:1px solid transparent; white-space:nowrap; }
  nav a:hover { border-color:var(--ink); }
  nav a[aria-current="page"] { border-color:var(--signal); }
  .lang { display:flex; border:1px solid var(--line); }
  .lang button { font:500 12px/1 var(--mono); letter-spacing:.06em; background:none; border:0; padding:8px 10px; cursor:pointer; color:var(--sub); }
  .lang button + button { border-left:1px solid var(--line); }
  .lang button[aria-pressed="true"] { background:var(--ink); color:#fff; }

  /* 刻度線 */
  .ruler { height:10px; opacity:.4; background:
    repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 40px) 0 0/100% 10px no-repeat,
    repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 8px) 0 0/100% 5px no-repeat; }

  h1, h2, h3 { font-family:var(--serif); font-weight:700; line-height:1.4; margin:0; letter-spacing:.03em; }
  .view { animation:rise .5s ease both; }
  @keyframes rise { from { opacity:0; transform:translateY(10px); } }
  .btn { display:inline-flex; align-items:center; gap:10px; font:500 15px/1 var(--sans); text-decoration:none; padding:15px 24px; border:1px solid var(--ink); background:var(--ink); color:#fff; cursor:pointer; transition:background .2s,color .2s; }
  .btn:hover { background:var(--teal-deep); border-color:var(--teal-deep); }
  .btn.ghost { background:none; color:var(--ink); }
  .btn.ghost:hover { background:var(--ink); color:#fff; }
  .btn[disabled] { opacity:.45; cursor:not-allowed; }
  .hint { color:var(--sub); font-size:14px; }
  .ph { color:var(--sub); border:1px dashed var(--line); padding:14px 16px; background:var(--card); font-size:14.5px; line-height:1.8; }

  /* 首頁 */
  .hero .wrap { display:grid; grid-template-columns:1.15fr .85fr; gap:40px; align-items:center; padding-top:84px; padding-bottom:72px; }
  .hero h1 { font-size:clamp(34px,5vw,58px); line-height:1.32; margin:18px 0 24px; text-wrap:balance; }
  h2, .page-head p, .closing p { text-wrap:balance; }
  html[lang=zh-Hant] .hero h1 { word-break:keep-all; overflow-wrap:anywhere; }
  .hero p.lead { max-width:30em; color:var(--sub); margin:0 0 34px; }
  .hero .cta { display:flex; flex-wrap:wrap; gap:12px; }
  .dial { width:100%; max-width:420px; justify-self:end; color:var(--teal); }
  .dial .spin { transform-origin:200px 200px; animation:spin 160s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .sec { padding:76px 0; }
  .sec-head { display:flex; justify-content:space-between; align-items:end; gap:20px; margin-bottom:34px; }
  .sec-head h2 { font-size:30px; margin-top:6px; }
  .sec-head a { font-size:15px; text-underline-offset:4px; white-space:nowrap; }
  .series { display:grid; grid-template-columns:repeat(3,1fr); border-top:1px solid var(--ink); }
  .series a { display:block; text-decoration:none; padding:26px 26px 30px 0; border-bottom:1px solid var(--line); transition:background .2s; }
  .series a + a { padding-left:26px; border-left:1px solid var(--line); }
  .series a:hover { background:var(--card); }
  .series h3 { font-size:22px; margin:8px 0 8px; }
  .series p { margin:0; color:var(--sub); font-size:14.5px; }
  .band { background:var(--teal-deep); color:#eef3f1; }
  .band .wrap { display:grid; grid-template-columns:1fr 1fr; gap:56px; padding-top:72px; padding-bottom:72px; }
  .band h2 { font-size:30px; margin:6px 0 0; }
  .band .mono { color:#a9c6c2; }
  .band p { margin:0 0 22px; color:#d5e2df; }
  .band a { text-underline-offset:4px; }
  .newslist { list-style:none; margin:0; padding:0; border-top:1px solid var(--ink); }
  .newslist li { display:grid; grid-template-columns:130px 1fr; gap:16px; padding:18px 0; border-bottom:1px solid var(--line); }
  .newslist time { font-family:var(--mono); font-size:13px; color:var(--sub); padding-top:3px; }
  .closing { text-align:center; }
  .closing h2 { font-size:32px; margin-bottom:12px; }
  .closing p { color:var(--sub); margin:0 0 28px; }

  /* 內頁 */
  .page-head { padding:64px 0 36px; }
  .page-head h1 { font-size:clamp(30px,4vw,44px); margin:10px 0 14px; }
  .page-head p { max-width:40em; color:var(--sub); margin:0; }
  .filters { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:28px; }
  .filters button { font:14px/1 var(--sans); padding:10px 16px; background:none; border:1px solid var(--line); cursor:pointer; color:var(--ink); }
  .filters button[aria-pressed="true"] { background:var(--ink); border-color:var(--ink); color:#fff; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; padding-bottom:88px; }
  .card { display:block; text-decoration:none; background:var(--card); border:1px solid var(--line); transition:border-color .2s, transform .2s; }
  .card:hover { border-color:var(--ink); transform:translateY(-3px); }
  .card .art { aspect-ratio:4/3; display:grid; place-items:center; border-bottom:1px solid var(--line); color:var(--teal); }
  .card .art svg { width:64%; }
  .card .body { padding:18px 20px 20px; }
  .card h3 { font-size:19px; margin:4px 0 10px; }
  .card .more { font-size:14px; color:var(--teal); }
  .detail { display:grid; grid-template-columns:1fr 1fr; gap:56px; padding:20px 0 88px; align-items:start; }
  .detail .art { background:var(--card); border:1px solid var(--line); aspect-ratio:1; display:grid; place-items:center; color:var(--teal); position:relative; }
  .detail .art svg { width:68%; }
  .detail .art small { position:absolute; left:14px; bottom:10px; }
  .detail h1 { font-size:34px; margin:8px 0 22px; scroll-margin-top:96px; }
  dl.spec { margin:0 0 24px; border-top:1px solid var(--ink); }
  dl.spec div { display:grid; grid-template-columns:140px 1fr; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
  dl.spec dt { color:var(--sub); font-size:14.5px; }
  dl.spec dd { margin:0; font-family:var(--mono); font-size:14.5px; word-break:break-word; }
  dl.spec dd.empty { font-family:var(--sans); color:var(--sub); }
  .actions { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:22px; }
  .back { display:inline-block; margin-top:40px; font-size:14.5px; text-underline-offset:4px; }
  .cols3 { display:grid; grid-template-columns:repeat(3,1fr); gap:32px; padding-bottom:88px; }
  .cols3 h2 { font-size:22px; margin:6px 0 14px; }
  .contact { display:grid; grid-template-columns:1.2fr .8fr; gap:64px; padding-bottom:88px; }
  form label { display:block; font-size:14.5px; margin:0 0 18px; }
  form input[type=text], form input[type=email], form input[type=tel], form textarea, .admin input { display:block; width:100%; margin-top:6px; font:16px/1.6 var(--sans); padding:11px 12px; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:0; }
  form textarea { min-height:130px; resize:vertical; }
  form .consent { display:flex; gap:10px; align-items:flex-start; }
  form .consent input { margin-top:7px; }
  .formmsg { margin-top:16px; padding:12px 14px; background:var(--card); border:1px solid var(--teal); font-size:14.5px; }
  .info dl { margin:0; border-top:1px solid var(--ink); }
  .info div { padding:14px 0; border-bottom:1px solid var(--line); }
  .info dt { font-size:13.5px; color:var(--sub); }
  .info dd { margin:0; }

  /* 後台示範 */
  .admin { position:fixed; z-index:40; right:0; top:0; bottom:0; width:min(400px,100%); background:#fff; border-left:1px solid var(--ink); padding:26px 24px; overflow:auto; box-shadow:-18px 0 40px rgba(21,34,43,.12); }
  .admin:focus { outline:none; }
  .admin h2 { font-size:21px; margin:6px 0 8px; }
  .admin label { display:block; font-size:13.5px; color:var(--sub); margin-top:14px; }
  .admin .row { display:flex; gap:10px; margin-top:22px; }
  @media (min-width:861px) { body.editing main, body.editing footer { margin-right:400px; } body.editing .detail { grid-template-columns:minmax(140px,.5fr) 1fr; gap:32px; } }

  footer { border-top:1px solid var(--line); padding:30px 0 44px; color:var(--sub); font-size:13.5px; }
  footer .wrap { display:flex; flex-wrap:wrap; gap:8px 28px; justify-content:space-between; }

  @media (max-width:860px) {
    .wrap { padding:0 20px; }
    .top .wrap { flex-wrap:wrap; gap:0 16px; padding-top:10px; }
    nav { order:3; width:100%; overflow-x:auto; gap:12px; justify-content:space-between; padding:4px 0 8px; scrollbar-width:none; }
    nav a { font-size:14px; } html[lang=ja] nav a { font-size:13px; }
    nav::-webkit-scrollbar { display:none; }
    .brand span { font-size:17px; }
    .hero .wrap { grid-template-columns:1fr; padding-top:48px; padding-bottom:48px; }
    .dial { max-width:240px; justify-self:start; order:-1; }
    .sec { padding:56px 0; }
    .sec-head h2, .band h2, .closing h2 { font-size:25px; }
    .series, .grid, .cols3, .band .wrap, .detail, .contact { grid-template-columns:1fr; }
    .series a, .series a + a { padding:22px 0; border-left:0; }
    .band .wrap { gap:24px; padding-top:52px; padding-bottom:52px; }
    .detail { gap:28px; } .detail h1 { font-size:27px; }
    .contact { gap:40px; }
    .newslist li { grid-template-columns:1fr; gap:2px; }
    dl.spec div { grid-template-columns:110px 1fr; }
    .draft .wrap { align-items:flex-start; }
    .admin { top:auto; width:100%; height:56vh; border-left:0; border-top:1px solid var(--ink); padding:18px 20px 24px; box-shadow:0 -18px 40px rgba(21,34,43,.14); }
    body.editing main { padding-bottom:56vh; }
    .detail h1 { scroll-margin-top:132px; }
  }
  @media (prefers-reduced-motion:reduce) { .view, .dial .spin { animation:none; } html { scroll-behavior:auto; } .card:hover { transform:none; } }
</style>
</head>
<body>

<div class="draft"><div class="wrap">
  <span><b data-i18n="draftTag"></b><span data-i18n="draftText"></span></span>
  <a href="./" data-i18n="draftBack"></a>
</div></div>

<header class="top"><div class="wrap">
  <a class="brand" href="#/">
    <svg viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="15" cy="15" r="13"/><circle cx="15" cy="15" r="5.5"/><path d="M15 0v6M15 24v6M0 15h6M24 15h6"/></svg>
    <span>奈美德醫療器材</span>
  </a>
  <nav aria-label="主選單">
    <a href="#/" data-nav="home" data-i18n="navHome"></a>
    <a href="#/products" data-nav="products" data-i18n="navProducts"></a>
    <a href="#/about" data-nav="about" data-i18n="navAbout"></a>
    <a href="#/news" data-nav="news" data-i18n="navNews"></a>
    <a href="#/contact" data-nav="contact" data-i18n="navContact"></a>
  </nav>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="zh-Hant">繁中</button><button type="button" data-lang="ja">日本語</button><button type="button" data-lang="en">EN</button>
  </div>
</div></header>

<main>
  <!-- 首頁 -->
  <div class="view" data-view="home">
    <section class="hero"><div class="wrap">
      <div>
        <p class="mono" data-i18n="heroKicker"></p>
        <h1 data-i18n="heroTitle"></h1>
        <p class="lead" data-i18n="heroLead"></p>
        <div class="cta"><a class="btn" href="#/products" data-i18n="heroCta1"></a><a class="btn ghost" href="#/contact" data-i18n="heroCta2"></a></div>
      </div>
      <svg class="dial" viewBox="0 0 400 400" fill="none" stroke="currentColor" aria-hidden="true">
        <g class="spin" id="ticks" stroke-width="1"></g>
        <circle cx="200" cy="200" r="150" stroke-width="1"/><circle cx="200" cy="200" r="96" stroke-width="1" stroke-dasharray="2 6"/>
        <circle cx="200" cy="200" r="44" stroke-width="1.5"/><path d="M200 120v160M120 200h160" stroke-width="1"/>
        <circle cx="306" cy="94" r="5" fill="#b9412b" stroke="none"/>
      </svg>
    </div></section>
    <div class="wrap"><div class="ruler"></div></div>

    <section class="sec"><div class="wrap">
      <div class="sec-head"><div><p class="mono">01 — Products</p><h2 data-i18n="homeProducts"></h2></div><a href="#/products" data-i18n="viewAll"></a></div>
      <div class="series">
        <a href="#/products?s=A"><span class="mono">Series A</span><h3 data-i18n="seriesA"></h3><p data-i18n="seriesNote"></p></a>
        <a href="#/products?s=B"><span class="mono">Series B</span><h3 data-i18n="seriesB"></h3><p data-i18n="seriesNote"></p></a>
        <a href="#/products?s=C"><span class="mono">Series C</span><h3 data-i18n="seriesC"></h3><p data-i18n="seriesNote"></p></a>
      </div>
    </div></section>

    <section class="band"><div class="wrap">
      <div><p class="mono">02 — About</p><h2 data-i18n="homeAbout"></h2></div>
      <div><p data-i18n="homeAboutText"></p><a href="#/about" data-i18n="homeAboutLink"></a></div>
    </div></section>

    <section class="sec"><div class="wrap">
      <div class="sec-head"><div><p class="mono">03 — News</p><h2 data-i18n="navNews"></h2></div><a href="#/news" data-i18n="viewAll"></a></div>
      <ul class="newslist" data-news></ul>
    </div></section>

    <div class="wrap"><div class="ruler"></div></div>
    <section class="sec closing"><div class="wrap">
      <h2 data-i18n="closingTitle"></h2><p data-i18n="closingText"></p>
      <a class="btn" href="#/contact" data-i18n="heroCta2"></a>
    </div></section>
  </div>

  <!-- 產品列表 -->
  <div class="view" data-view="products" hidden><div class="wrap">
    <div class="page-head"><p class="mono">Products</p><h1 data-i18n="navProducts"></h1><p data-i18n="productsLead"></p></div>
    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>
  </div></div>

  <!-- 產品內頁 -->
  <div class="view" data-view="product" hidden><div class="wrap">
    <a class="back" href="#/products" data-i18n="backToList"></a>
    <div class="detail" id="detail"></div>
  </div></div>

  <!-- 關於 -->
  <div class="view" data-view="about" hidden><div class="wrap">
    <div class="page-head"><p class="mono">About</p><h1 data-i18n="navAbout"></h1><p data-i18n="aboutLead"></p></div>
    <div class="cols3">
      <div><p class="mono">01</p><h2 data-i18n="about1"></h2><p class="ph" data-i18n="about1Text"></p></div>
      <div><p class="mono">02</p><h2 data-i18n="about2"></h2><p class="ph" data-i18n="about2Text"></p></div>
      <div><p class="mono">03</p><h2 data-i18n="about3"></h2><p class="ph" data-i18n="about3Text"></p></div>
    </div>
  </div></div>

  <!-- 最新消息 -->
  <div class="view" data-view="news" hidden><div class="wrap">
    <div class="page-head"><p class="mono">News</p><h1 data-i18n="navNews"></h1><p data-i18n="newsLead"></p></div>
    <ul class="newslist" data-news style="margin-bottom:88px"></ul>
  </div></div>

  <!-- 聯絡 -->
  <div class="view" data-view="contact" hidden><div class="wrap">
    <div class="page-head"><p class="mono">Contact</p><h1 data-i18n="navContact"></h1><p data-i18n="contactLead"></p></div>
    <div class="contact">
      <form id="form" novalidate>
        <label><span data-i18n="fName"></span> *<input type="text" name="name" required autocomplete="name"></label>
        <label><span data-i18n="fCompany"></span><input type="text" name="company" autocomplete="organization"></label>
        <label><span data-i18n="fEmail"></span> *<input type="email" name="email" required autocomplete="email"></label>
        <label><span data-i18n="fPhone"></span><input type="tel" name="phone" autocomplete="tel"></label>
        <label><span data-i18n="fMessage"></span> *<textarea name="message" required></textarea></label>
        <label class="consent"><input type="checkbox" required><span data-i18n="fConsent"></span></label>
        <button class="btn" type="submit" data-i18n="fSubmit"></button>
        <p class="formmsg" id="formmsg" role="status" hidden></p>
      </form>
      <div class="info"><dl>
        <div><dt data-i18n="iAddress"></dt><dd data-i18n="iAddressV"></dd></div>
        <div><dt data-i18n="iPhone"></dt><dd data-i18n="iPhoneV"></dd></div>
        <div><dt data-i18n="iHours"></dt><dd data-i18n="iHoursV"></dd></div>
      </dl></div>
    </div>
  </div></div>
</main>

<aside class="admin" id="admin" hidden aria-labelledby="adminTitle" tabindex="-1">
  <p class="mono">WordPress · Demo</p>
  <h2 id="adminTitle" data-i18n="adminTitle"></h2>
  <p class="hint" data-i18n="adminHint"></p>
  <label><span data-i18n="sName"></span><input data-f="name"></label>
  <label><span data-i18n="sClass"></span><input data-f="cls"></label>
  <label><span data-i18n="sLicence"></span><input data-f="lic"></label>
  <label><span data-i18n="sDims"></span><input data-f="dims"></label>
  <label><span data-i18n="sWeight"></span><input data-f="weight"></label>
  <label><span data-i18n="sPower"></span><input data-f="power"></label>
  <div class="row"><button class="btn" type="button" id="adminClose" data-i18n="adminClose"></button><button class="btn ghost" type="button" id="adminReset" data-i18n="adminReset"></button></div>
</aside>

<footer><div class="wrap"><span data-i18n="footNote"></span><span data-i18n="footPrivacy"></span></div></footer>

<script>
const I18N = {
  'zh-Hant': {
    navLabel:'主選單', draftTag:'設計初稿', draftText:'內容皆為示意，這不是奈美德醫療器材的官方網站。', draftBack:'回到答覆書',
    navHome:'首頁', navProducts:'產品介紹', navAbout:'關於我們', navNews:'最新消息', navContact:'聯絡我們',
    heroKicker:'台灣市場 · 醫療器材', heroTitle:'醫療器材，在台灣的服務窗口。',
    heroLead:'這是首頁的設計初稿。標語和圖像都是示意，正式內容由貴公司提供。右上角可以切換日文和英文，三個語言共用同一套版型。',
    heroCta1:'看產品', heroCta2:'聯絡我們', viewAll:'看全部',
    homeProducts:'產品系列', seriesA:'系列 A', seriesB:'系列 B', seriesC:'系列 C',
    seriesNote:'這裡放一句話：給誰用、用在哪裡。不寫療效。',

function applyI18n() {
  document.documentElement.lang = lang;
  $('nav').setAttribute('aria-label', t('navLabel'));
  $$('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  $$('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));

}
function renderGrid() {
  $('#filters').innerHTML = ['', 'A', 'B', 'C'].map(s => `<button type="button" data-s="${s}" aria-pressed="${s === filter}">${s ? esc(t('series' + s)) : esc(t('filterAll'))}</button>`).join('');
  $('#grid').innerHTML = products.filter(p => !filter || p.s === filter).map(p => `<a class="card" href="#/products/${p.id}"><div class="art">${art(p.shape)}</div><div class="body"><span class="mono">Series ${p.s} · ${esc(t('sClassShort'))} ${esc(p.cls)}</span><h3>${esc(nameOf(p))}</h3><span class="more">${esc(t('more'))} →</span></div></a>`).join('');
}
function renderDetail() {
  const p = current; if (!p) return;
  const row = (k, v, empty) => `<div><dt>${esc(t(k))}</dt><dd${v ? '' : ' class="empty"'}>${esc(v || empty)}</dd></div>`;
  $('#detail').innerHTML = `<div class="art">${art(p.shape)}<small class="mono">${esc(t('specSample'))}</small></div>

    <p class="hint">${esc(t('detailNote'))}</p></div>`;
}
function fillAdmin() { $$('#admin [data-f]').forEach(i => i.value = i.dataset.f === 'name' ? nameOf(current) : current[i.dataset.f]); }
function route() {
  const [path, query] = (location.hash.slice(2) || '').split('?');
  const [view, id] = path.split('/');
  let name = ['products', 'about', 'news', 'contact'].includes(view) ? view : 'home';
  if (name === 'products') {
    if (id) { current = products.find(p => p.id === id) || null; name = current ? 'product' : 'products'; }
    if (name === 'products') { filter = new URLSearchParams(query || '').get('s') || ''; renderGrid(); }
  }
  if (name !== 'product') setAdmin(false); else { renderDetail(); if (!$('#admin').hidden) fillAdmin(); }
  $$('[data-view]').forEach(v => v.hidden = v.dataset.view !== name);
  $$('[data-nav]').forEach(a => a.dataset.nav === (name === 'product' ? 'products' : name) ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  window.scrollTo(0, 0);
}
function setLang(l) { lang = I18N[l] ? l : 'zh-Hant'; try { localStorage.setItem('lang', lang); } catch (e) {} applyI18n(); renderGrid(); renderDetail(); if (!$('#admin').hidden) fillAdmin(); }

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.lang) setLang(b.dataset.lang);
  else if ('s' in b.dataset) { filter = b.dataset.s; renderGrid(); }
  else if (b.id === 'adminOpen') setAdmin(true);
  else if (b.id === 'adminClose') setAdmin(false);
  else if (b.id === 'adminReset') { const id = current.id; reset(); current = products.find(p => p.id === id); renderDetail(); fillAdmin(); }
});
$('#admin').addEventListener('input', e => {
  const f = e.target.dataset.f; if (!f || !current) return;
  if (f === 'name') current.name[lang] = e.target.value; else current[f] = e.target.value;
  renderDetail();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') setAdmin(false); });
$('#form').addEventListener('submit', e => {
  e.preventDefault();
  const m = $('#formmsg'); m.hidden = false; m.textContent = t(e.target.checkValidity() ? 'fDemo' : 'fRequired');
});

reset();
try { lang = localStorage.getItem('lang') || lang; } catch (e) {}
setLang(lang); route();
addEventListener('hashchange', route);
